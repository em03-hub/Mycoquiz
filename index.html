<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MycoQuiz - Apprentissage Rapide</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍄</text></svg>">
    <meta name="description" content="Apprenez à identifier les champignons avec MycoQuiz. Mode Classique, Sprint QCM et Entraînement sur les Paires Confuses.">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Palette Nature/Beige
                        myco: {
                            50: '#FBF9F6', // Fond principal
                            100: '#F2EBE1', // Fond éléments
                            200: '#E4D5C2', // Bordures
                            800: '#4A3B2C', // Textes foncés
                            900: '#2C2218',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FBF9F6;
        }

        .glass-header {
            background: rgba(251, 249, 246, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .mushroom-img-container {
            width: 100%;
            aspect-ratio: 4/3;
            border-radius: 1rem;
            background-color: #F2EBE1;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .mushroom-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: fadeIn 0.5s ease-in-out;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        /* Effet de clic pour le mode paires */
        .interactive-img:hover {
            transform: scale(1.02);
        }
        .interactive-img:active {
            transform: scale(0.98);
        }

        @keyframes fadeIn {
            from { opacity: 0; filter: blur(4px); }
            to { opacity: 1; filter: blur(0); }
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #E4D5C2;
            border-bottom-color: #f97316;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Barre de timer pour le Sprint */
        #sprint-timer-bar {
            width: 100%;
        }

        /* Overlay 2e image classique */
        .reveal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(242, 235, 225, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }
        .reveal-overlay.hidden-overlay { opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="text-myco-800 min-h-screen flex flex-col items-center pb-12">

    <header class="w-full glass-header sticky top-0 z-50 shadow-sm mb-6">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col gap-4">
            
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold tracking-tight text-myco-900 flex items-center gap-2">
                    🍄 MycoQuiz
                </h1>
                <span class="text-sm font-bold bg-orange-100 text-orange-800 px-3 py-1 rounded-full">Score: <span id="score-text">0</span></span>
            </div>

            <!-- Sélecteur de Mode -->
            <div class="flex gap-2 bg-myco-100 p-1.5 rounded-xl overflow-x-auto no-scrollbar">
                <button onclick="setMode('classique')" id="btn-mode-classique" class="flex-1 min-w-[100px] px-4 py-2 text-sm font-semibold rounded-lg bg-white shadow text-myco-900 transition-all">Classique</button>
                <button onclick="setMode('sprint')" id="btn-mode-sprint" class="flex-1 min-w-[100px] px-4 py-2 text-sm font-semibold rounded-lg text-myco-800 hover:bg-white/50 transition-all">⚡ Sprint QCM</button>
                <button onclick="setMode('paires')" id="btn-mode-paires" class="flex-1 min-w-[110px] px-4 py-2 text-sm font-semibold rounded-lg text-myco-800 hover:bg-white/50 transition-all">⚖️ Paires Confuses</button>
            </div>

            <!-- Sélecteur de Semaine (Caché en mode Paires) -->
            <div id="week-selector" class="flex gap-2">
                <button onclick="setDB('s1s2')" id="btn-db-s1s2" class="px-4 py-1.5 text-xs font-bold rounded-full bg-myco-900 text-white transition-all">Semaines 1 & 2</button>
                <button onclick="setDB('s3')" id="btn-db-s3" class="px-4 py-1.5 text-xs font-bold rounded-full bg-myco-200 text-myco-800 hover:bg-myco-900 hover:text-white transition-all">Semaine 3</button>
            </div>

        </div>
    </header>

    <main class="w-full max-w-4xl px-4 flex-grow flex flex-col">
        
        <div class="text-sm font-semibold text-slate-500 mb-2 px-1" id="progress-text">Question 1 / X</div>

        <div class="bg-white rounded-2xl shadow-sm border border-myco-200 overflow-hidden relative flex-grow flex flex-col">
            
            <!-- Chargement commun -->
            <div id="loading-view" class="hidden flex-grow flex-col items-center justify-center py-24">
                <span class="loader mb-4"></span>
                <p class="text-myco-800 font-medium text-sm animate-pulse">Recherche des spécimens...</p>
            </div>

            <!-- ============================================== -->
            <!-- VUE 1 : CLASSIQUE                              -->
            <!-- ============================================== -->
            <div id="view-classique" class="hidden p-4 sm:p-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <div class="mushroom-img-container">
                        <img id="classique-img-1" src="" class="mushroom-img hidden" alt="Champignon 1">
                    </div>
                    <div class="mushroom-img-container">
                        <div id="classique-overlay-2" class="reveal-overlay" onclick="revealImageClassique()">
                            <span class="text-3xl mb-2">👁️</span>
                            <span class="text-sm font-semibold text-myco-800">Révéler la 2ème image</span>
                        </div>
                        <img id="classique-img-2" src="" class="mushroom-img hidden" alt="Champignon 2">
                    </div>
                </div>

                <div class="mb-5">
                    <button onclick="document.getElementById('classique-hint').classList.toggle('hidden')" class="text-sm font-medium text-orange-600 hover:text-orange-800 flex items-center gap-1">
                        💡 Afficher le nom commun
                    </button>
                    <div id="classique-hint" class="hidden mt-2 p-3 bg-orange-50 border border-orange-100 rounded-lg text-sm text-orange-900 font-bold"></div>
                </div>

                <form onsubmit="event.preventDefault(); verifyClassique();" class="flex flex-col gap-2">
                    <label class="text-sm font-semibold text-myco-800">Nom Latin du champignon :</label>
                    <input type="text" id="classique-input" class="w-full px-4 py-3 text-lg font-medium text-myco-900 bg-myco-50 border-2 border-myco-200 rounded-xl focus:outline-none focus:border-orange-500 transition-all placeholder-gray-400" placeholder="Ex: Boletus edulis..." autocomplete="off" spellcheck="false">
                    <div id="classique-feedback" class="text-sm font-medium min-h-[24px] mt-1 pl-1"></div>
                    
                    <div class="mt-4 flex gap-3">
                        <button type="submit" id="classique-btn-verify" class="flex-1 bg-myco-900 hover:bg-black text-white font-bold py-3.5 px-4 rounded-xl shadow-sm transition-all">Vérifier</button>
                        <button type="button" id="classique-btn-next" onclick="nextQuestion()" class="hidden flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-sm transition-all">Suivant ➔</button>
                    </div>
                </form>
            </div>

            <!-- ============================================== -->
            <!-- VUE 2 : SPRINT QCM (8 secondes)                -->
            <!-- ============================================== -->
            <div id="view-sprint" class="hidden flex-col p-4 sm:p-6">
                <!-- Barre de temps -->
                <div class="w-full bg-gray-200 h-2.5 rounded-full mb-6 overflow-hidden">
                    <div id="sprint-timer-bar" class="h-full bg-orange-500 w-full"></div>
                </div>

                <div class="mushroom-img-container sm:max-w-xl mx-auto mb-6">
                    <img id="sprint-img" src="" class="mushroom-img hidden" alt="Champignon à identifier">
                </div>

                <div id="sprint-feedback" class="text-center font-bold text-lg h-8 mb-4"></div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="sprint-buttons">
                    <!-- Boutons générés en JS -->
                </div>
                
                <button type="button" id="sprint-btn-next" onclick="nextQuestion()" class="hidden mt-6 w-full bg-myco-900 text-white font-bold py-4 rounded-xl shadow-sm transition-all">Question Suivante ➔</button>
            </div>

            <!-- ============================================== -->
            <!-- VUE 3 : PAIRES CONFUSES                        -->
            <!-- ============================================== -->
            <div id="view-paires" class="hidden flex-col p-4 sm:p-6">
                <div class="text-center mb-6">
                    <p class="text-sm text-slate-500 font-semibold uppercase tracking-wider mb-1">Associez le bon champignon</p>
                    <h2 class="text-2xl sm:text-3xl font-bold text-myco-900">Lequel est <span id="paires-target-name" class="text-orange-600 italic">...</span> ?</h2>
                    <p id="paires-target-commun" class="text-sm font-medium text-slate-600 mt-1">...</p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <div class="mushroom-img-container interactive-img ring-4 ring-transparent transition-all" id="paires-container-0" onclick="verifyPaires(0)">
                        <img id="paires-img-0" src="" class="mushroom-img hidden" alt="Choix 1">
                    </div>
                    <div class="mushroom-img-container interactive-img ring-4 ring-transparent transition-all" id="paires-container-1" onclick="verifyPaires(1)">
                        <img id="paires-img-1" src="" class="mushroom-img hidden" alt="Choix 2">
                    </div>
                </div>

                <!-- Panneau de réponse -->
                <div id="paires-result-panel" class="hidden flex-col items-center bg-myco-50 border border-myco-200 rounded-xl p-5 mb-4 text-center">
                    <h3 id="paires-result-title" class="text-xl font-bold mb-2"></h3>
                    <p id="paires-hint" class="text-myco-800 font-medium"></p>
                </div>

                <button type="button" id="paires-btn-next" onclick="nextQuestion()" class="hidden w-full bg-myco-900 text-white font-bold py-4 rounded-xl shadow-sm transition-all">Suivant ➔</button>
            </div>

            <!-- ============================================== -->
            <!-- VUE FIN DE PARTIE                              -->
            <!-- ============================================== -->
            <div id="view-end" class="hidden flex-grow flex-col items-center justify-center py-20 px-4 text-center bg-white">
                <div id="end-icon" class="text-7xl mb-6 drop-shadow-md">🏆</div>
                <h2 class="text-3xl font-bold text-myco-900 mb-2">Session Terminée !</h2>
                <p class="text-slate-600 mb-4 text-lg">Votre score final : <span id="final-score" class="font-bold text-orange-600 text-2xl"></span></p>
                <p id="custom-message" class="text-lg font-medium mb-8 max-w-md mx-auto"></p>
                <button onclick="startSession()" class="bg-myco-900 hover:bg-black text-white font-bold py-4 px-8 rounded-xl shadow-md transition-all transform hover:scale-105">
                    🔄 Recommencer
                </button>
            </div>

        </div>
    </main>

        // Base de données spéciale pour les Paires Confuses
        const db_pairs = [
            { l1: "Amanita phalloides", c1: "Amanite phalloïde", l2: "Amanita citrina", c2: "Amanite citrine", hint: "⚠️ La phalloïde a un bulbe en sac, la citrine a un bulbe marginé et sent souvent la pomme de terre crue." },

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let hasAnswered = false;
        
        let sprintTimeout;
        let pairesCorrectIndex = 0; // 0 (gauche) ou 1 (droite)

        // ------------------------------------------------------------------
        // UTILITAIRES
        // ------------------------------------------------------------------
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function normalizeString(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z]/g, "");
        }

        // Filtre agressif pour l'apprentissage
        async function fetchImagesWiki(mushroomName, count=1) {
            const query = encodeURIComponent(mushroomName);
            const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${query}&gsrnamespace=6&gsrlimit=20&prop=imageinfo&iiprop=url&iiurlwidth=800&format=json&origin=*`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                let images = [];
                
                if (data.query && data.query.pages) {
                    const pages = Object.values(data.query.pages);
                    // Mots clés à bannir pour l'apprentissage visuel
                    const bad = ['.svg', '.pdf', 'diagram', 'schema', 'map', 'icon', 'text', 'microscop', 'spore', 'mycelium', 'herbarium', 'exsiccata', 'dried', 'seché', 'drawing', 'illustration', 'painting', 'print', 'stamp'];
                    
                    for (let p of pages) {
                        if (p.imageinfo && p.imageinfo.length > 0) {
                            let imgUrl = p.imageinfo[0].thumburl || p.imageinfo[0].url;
                            let title = p.title ? p.title.toLowerCase() : "";
                            let lowerUrl = imgUrl.toLowerCase();
                            
                            const isBad = bad.some(kw => lowerUrl.includes(kw) || title.includes(kw));
                            if (!isBad) images.push(imgUrl);
                        }
                    }
                }
                
                images = shuffleArray(images);
                let finalImages = images.slice(0, count);
                
                while(finalImages.length < count) {
                    finalImages.push(`https://placehold.co/800x600/e2e8f0/64748b?text=Image+Non+Trouv%C3%A9e`);
                }
                return finalImages;
            } catch (error) {
                return Array(count).fill(`https://placehold.co/800x600/fee2e2/ef4444?text=Erreur`);
            }
        }

        // ------------------------------------------------------------------
        // GESTION DES MODES & NAVIGATION
        // ------------------------------------------------------------------
        function setMode(mode) {
            currentMode = mode;
            
            // Mise à jour de la barre de navigation
            const modes = ['classique', 'sprint', 'paires'];
            modes.forEach(m => {
                const btn = document.getElementById(`btn-mode-${m}`);
                if (m === mode) {
                    btn.className = "flex-1 min-w-[100px] px-4 py-2 text-sm font-semibold rounded-lg bg-white shadow text-myco-900 transition-all";
                } else {
                    btn.className = "flex-1 min-w-[100px] px-4 py-2 text-sm font-semibold rounded-lg text-myco-800 hover:bg-white/50 transition-all";
                }
            });

            // Afficher/Cacher le sélecteur de semaine
            document.getElementById('week-selector').style.display = (mode === 'paires') ? 'none' : 'flex';
            
            startSession();
        }

        function setDB(dbName) {
            activeDBName = dbName;
            document.getElementById('btn-db-s1s2').className = (dbName === 's1s2') ? "px-4 py-1.5 text-xs font-bold rounded-full bg-myco-900 text-white transition-all" : "px-4 py-1.5 text-xs font-bold rounded-full bg-myco-200 text-myco-800 hover:bg-myco-900 hover:text-white transition-all";
            document.getElementById('btn-db-s3').className = (dbName === 's3') ? "px-4 py-1.5 text-xs font-bold rounded-full bg-myco-900 text-white transition-all" : "px-4 py-1.5 text-xs font-bold rounded-full bg-myco-200 text-myco-800 hover:bg-myco-900 hover:text-white transition-all";
            startSession();
        }

        function getActiveDB() {
            if (currentMode === 'paires') return db_pairs;
            return (activeDBName === 's1s2') ? db_s1s2 : db_s3;
        }

        function startSession() {
            const db = getActiveDB();
            let shuffled = shuffleArray([...Array(db.length).keys()]);
            
            // Limiter à 10 questions si on est dans le mode paires
            if (currentMode === 'paires') {
                currentQuestions = shuffled.slice(0, 10);
            } else {
                currentQuestions = shuffled;
            }
            
            currentIndex = 0;
            score = 0;
            document.getElementById('score-text').innerText = score;
            
            // Masquer la fin, montrer le chargement
            document.getElementById('view-end').classList.add('hidden');
            document.getElementById('view-end').classList.remove('flex');
            
            loadQuestion();
        }

        // ------------------------------------------------------------------
        // LOGIQUE PRINCIPALE DU JEU
        // ------------------------------------------------------------------
        async function loadQuestion() {
            if (currentIndex >= currentQuestions.length) {
                showEndScreen();
                return;
            }

            hasAnswered = false;
            document.getElementById('progress-text').innerText = `Question ${currentIndex + 1} / ${currentQuestions.length}`;
            
            // Masquer toutes les vues et afficher le chargement
            document.getElementById('view-classique').classList.add('hidden');
            document.getElementById('view-sprint').classList.add('hidden');
            document.getElementById('view-paires').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('hidden');
            document.getElementById('loading-view').classList.add('flex');

            const db = getActiveDB();
            const qData = db[currentQuestions[currentIndex]];

            // Préparation selon le mode
            if (currentMode === 'classique') {
                await prepareClassique(qData);
                document.getElementById('view-classique').classList.remove('hidden');
            } 
            else if (currentMode === 'sprint') {
                await prepareSprint(qData);
                document.getElementById('view-sprint').classList.remove('hidden');
                document.getElementById('view-sprint').classList.add('flex');
                startSprintTimer();
            } 
            else if (currentMode === 'paires') {
                await preparePaires(qData);
                document.getElementById('view-paires').classList.remove('hidden');
                document.getElementById('view-paires').classList.add('flex');
            }

            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('flex');
        }

        function nextQuestion() {
            if (!hasAnswered) return;
            currentIndex++;
            loadQuestion();
        }

        // ==========================================
        // MODE CLASSIQUE
        // ==========================================
        async function prepareClassique(mushroom) {
            const images = await fetchImagesWiki(mushroom.l, 2);
            
            document.getElementById('classique-img-1').src = images[0];
            document.getElementById('classique-img-1').classList.remove('hidden');
            
            document.getElementById('classique-img-2').src = images[1];
            document.getElementById('classique-img-2').classList.add('hidden');
            document.getElementById('classique-overlay-2').classList.remove('hidden-overlay');

            document.getElementById('classique-hint').innerText = mushroom.c;
            document.getElementById('classique-hint').classList.add('hidden');

            const inputEl = document.getElementById('classique-input');
            inputEl.value = '';
            inputEl.className = "w-full px-4 py-3 text-lg font-medium text-myco-900 bg-myco-50 border-2 border-myco-200 rounded-xl focus:outline-none focus:border-orange-500 transition-all placeholder-gray-400";
            inputEl.disabled = false;
            
            document.getElementById('classique-feedback').innerHTML = '';
            document.getElementById('classique-btn-verify').classList.remove('hidden');
            document.getElementById('classique-btn-next').classList.add('hidden');

            setTimeout(() => { if(window.innerWidth > 768) inputEl.focus(); }, 50);
        }

        function revealImageClassique() {
            document.getElementById('classique-overlay-2').classList.add('hidden-overlay');
            document.getElementById('classique-img-2').classList.remove('hidden');
            if (window.innerWidth > 768) document.getElementById('classique-input').focus();
        }

        function verifyClassique() {
            if (hasAnswered) return;
            const mushroom = getActiveDB()[currentQuestions[currentIndex]];
            const inputEl = document.getElementById('classique-input');
            const userNorm = normalizeString(inputEl.value);
            
            let isCorrect = mushroom.syn.some(s => normalizeString(s) === userNorm);
            hasAnswered = true;
            inputEl.disabled = true;
            document.getElementById('classique-overlay-2').classList.add('hidden-overlay');
            document.getElementById('classique-img-2').classList.remove('hidden');

            const feedback = document.getElementById('classique-feedback');
            if (isCorrect) {
                inputEl.classList.add('border-green-500', 'bg-green-50');
                feedback.innerHTML = `✨ <b>Exact !</b> C'est bien le <span class="text-green-700">${mushroom.c}</span>.`;
                feedback.className = "text-sm mt-2 pl-1 text-green-600";
                updateScore();
            } else {
                inputEl.classList.add('border-red-500', 'bg-red-50');
                feedback.innerHTML = `❌ <b>Faux.</b> Réponse : <span class="text-red-700 underline">${mushroom.l}</span> (${mushroom.c})`;
                feedback.className = "text-sm mt-2 pl-1 text-red-600";
            }
            
            document.getElementById('classique-btn-verify').classList.add('hidden');
            document.getElementById('classique-btn-next').classList.remove('hidden');
            document.getElementById('classique-btn-next').focus();
        }

        // ==========================================
        // MODE SPRINT QCM
        // ==========================================
        async function prepareSprint(mushroom) {
            const images = await fetchImagesWiki(mushroom.l, 1);
            document.getElementById('sprint-img').src = images[0];
            document.getElementById('sprint-img').classList.remove('hidden');
            
            document.getElementById('sprint-feedback').innerHTML = '';
            document.getElementById('sprint-btn-next').classList.add('hidden');

            // Générer 4 propositions
            const db = getActiveDB();
            let others = db.filter(m => m.l !== mushroom.l);
            others = shuffleArray(others).slice(0, 3);
            let options = shuffleArray([mushroom, ...others]);

            const btnContainer = document.getElementById('sprint-buttons');
            btnContainer.innerHTML = '';
            
            options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-center p-5 rounded-xl border-2 border-myco-200 bg-white hover:bg-myco-50 transition-all font-medium text-myco-900";
                // Modifié ici : Affichage uniquement du nom latin
                btn.innerHTML = `<span class="italic text-lg block">${opt.l}</span>`;
                btn.onclick = () => verifySprint(idx, options, mushroom);
                btnContainer.appendChild(btn);
            });
        }

        function startSprintTimer() {
            clearTimeout(sprintTimeout);
            const timerEl = document.getElementById('sprint-timer-bar');
            
            timerEl.style.transition = 'none';
            timerEl.style.width = '100%';
            timerEl.classList.remove('bg-red-500');
            timerEl.classList.add('bg-orange-500');
            
            void timerEl.offsetWidth; // Force reflow
            
            timerEl.style.transition = 'width 8s linear, background-color 8s linear';
            timerEl.style.width = '0%';
            timerEl.classList.add('bg-red-500');
            timerEl.classList.remove('bg-orange-500');

            sprintTimeout = setTimeout(() => {
                if(!hasAnswered) verifySprint(-1, null, getActiveDB()[currentQuestions[currentIndex]]);
            }, 8000);
        }

        function verifySprint(selectedIndex, options, correctMushroom) {
            if (hasAnswered) return;
            hasAnswered = true;
            clearTimeout(sprintTimeout);
            document.getElementById('sprint-timer-bar').style.transition = 'none';

            const buttons = document.getElementById('sprint-buttons').children;
            
            // Identifier le bon index si timeout
            if(!options) {
                // Reconstruction sommaire en cas de timeout pour trouver le bon bouton
                Array.from(buttons).forEach((btn, idx) => {
                    if (btn.innerHTML.includes(correctMushroom.l)) {
                        btn.classList.add('border-green-500', 'bg-green-50');
                    }
                });
                document.getElementById('sprint-feedback').innerHTML = `⏰ Temps écoulé ! C'était <i>${correctMushroom.l}</i>`;
                document.getElementById('sprint-feedback').className = "text-center font-bold text-lg h-8 mb-4 text-red-600";
            } else {
                const selectedOpt = options[selectedIndex];
                const isCorrect = (selectedOpt.l === correctMushroom.l);

                Array.from(buttons).forEach((btn, idx) => {
                    btn.disabled = true;
                    if (options[idx].l === correctMushroom.l) {
                        btn.classList.add('border-green-500', 'bg-green-50');
                    } else if (idx === selectedIndex && !isCorrect) {
                        btn.classList.add('border-red-500', 'bg-red-50');
                    }
                });

                if (isCorrect) {
                    updateScore();
                    document.getElementById('sprint-feedback').innerHTML = `⚡ Rapide et précis !`;
                    document.getElementById('sprint-feedback').className = "text-center font-bold text-lg h-8 mb-4 text-green-600";
                } else {
                    document.getElementById('sprint-feedback').innerHTML = `❌ Trop vite ! C'était <i>${correctMushroom.l}</i>`;
                    document.getElementById('sprint-feedback').className = "text-center font-bold text-lg h-8 mb-4 text-red-600";
                }
            }
            
            document.getElementById('sprint-btn-next').classList.remove('hidden');
        }

        // ==========================================
        // MODE PAIRES CONFUSES
        // ==========================================
        async function preparePaires(pairData) {
            // Choix aléatoire : on cherche l1 ou l2 ?
            const askFor1 = Math.random() > 0.5;
            const targetLatin = askFor1 ? pairData.l1 : pairData.l2;
            const targetCommun = askFor1 ? pairData.c1 : pairData.c2;
            
            document.getElementById('paires-target-name').innerText = targetLatin;
            document.getElementById('paires-target-commun').innerText = `(${targetCommun})`;

            // Récupérer les 2 images en parallèle
            const [img1, img2] = await Promise.all([
                fetchImagesWiki(pairData.l1, 1),
                fetchImagesWiki(pairData.l2, 1)
            ]);

            // Mélanger gauche/droite
            const put1Left = Math.random() > 0.5;
            pairesCorrectIndex = (askFor1 === put1Left) ? 0 : 1;

            const urlL = put1Left ? img1[0] : img2[0];
            const urlR = put1Left ? img2[0] : img1[0];

            document.getElementById('paires-img-0').src = urlL;
            document.getElementById('paires-img-0').classList.remove('hidden');
            document.getElementById('paires-img-1').src = urlR;
            document.getElementById('paires-img-1').classList.remove('hidden');

            // Reset UI
            [0, 1].forEach(i => {
                const c = document.getElementById(`paires-container-${i}`);
                c.className = "mushroom-img-container interactive-img ring-4 ring-transparent transition-all cursor-pointer";
            });
            document.getElementById('paires-result-panel').classList.add('hidden');
            document.getElementById('paires-result-panel').classList.remove('flex');
            document.getElementById('paires-btn-next').classList.add('hidden');
        }

        function verifyPaires(selectedIndex) {
            if (hasAnswered) return;
            hasAnswered = true;

            const pairData = getActiveDB()[currentQuestions[currentIndex]];
            const isCorrect = (selectedIndex === pairesCorrectIndex);

            // Mettre en évidence les images
            const correctContainer = document.getElementById(`paires-container-${pairesCorrectIndex}`);
            const wrongContainer = document.getElementById(`paires-container-${1 - pairesCorrectIndex}`);
            
            correctContainer.classList.replace('ring-transparent', 'ring-green-500');
            wrongContainer.classList.replace('ring-transparent', 'ring-red-500');
            wrongContainer.classList.add('opacity-50');

            // Afficher le résultat et l'indice de distinction
            const panel = document.getElementById('paires-result-panel');
            const title = document.getElementById('paires-result-title');
            
            panel.classList.remove('hidden');
            panel.classList.add('flex');
            
            document.getElementById('paires-hint').innerHTML = pairData.hint;

            if (isCorrect) {
                updateScore();
                title.innerHTML = `✅ Bien vu !`;
                title.className = "text-xl font-bold mb-2 text-green-700";
                panel.className = "flex flex-col items-center bg-green-50 border border-green-200 rounded-xl p-5 mb-4 text-center";
            } else {
                title.innerHTML = `❌ Confusion fatale !`;
                title.className = "text-xl font-bold mb-2 text-red-700";
                panel.className = "flex flex-col items-center bg-red-50 border border-red-200 rounded-xl p-5 mb-4 text-center";
            }

            document.getElementById('paires-btn-next').classList.remove('hidden');
        }

        // ==========================================
        // COMMUN : MISE À JOUR SCORE & FIN
        // ==========================================
        function updateScore() {
            score++;
            document.getElementById('score-text').innerText = score;
        }

        function showEndScreen() {
            document.getElementById(`view-${currentMode}`).classList.add('hidden');
            document.getElementById(`view-${currentMode}`).classList.remove('flex');
            
            const endScreen = document.getElementById('view-end');
            endScreen.classList.remove('hidden');
            endScreen.classList.add('flex');
            
            const total = currentQuestions.length;
            document.getElementById('final-score').innerText = `${score} / ${total}`;
            
            const messageEl = document.getElementById('custom-message');
            const iconEl = document.getElementById('end-icon');
            
            // Tes messages originaux réintégrés !
            if (score === total) {
                messageEl.innerText = "Score parfait ! Je mérite vraiment une bière ! 🍻🏆";
                messageEl.className = "text-xl font-bold text-green-600 mb-8";
                iconEl.innerText = "👑";
            } else if (score > total / 2) {
                messageEl.innerText = "Bravo, tu vas me devoir une bière ! 🍻";
                messageEl.className = "text-xl font-bold text-orange-500 mb-8";
                iconEl.innerText = "🏆";
            } else {
                messageEl.innerText = "Allez, on ne lâche rien ! Encore un petit essai pour avoir la moyenne ! 💪";
                messageEl.className = "text-xl font-medium text-myco-800 mb-8";
                iconEl.innerText = "🍄";
            }
        }

        // Initialisation au chargement de la page
        startSession();

    </script>
</body>
