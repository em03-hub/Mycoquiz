    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .mushroom-img-container {
            width: 100%;
            aspect-ratio: 4/3;
            border-radius: 0.75rem;
            background-color: #e2e8f0;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
        }

        .mushroom-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; filter: blur(4px); }
            to { opacity: 1; filter: blur(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        .input-error {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
            animation: shake 0.3s;
        }

        .input-success {
            border-color: #22c55e !important;
            background-color: #f0fdf4 !important;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-bottom-color: #3b82f6;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Overlay for hidden image */
        .reveal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(241, 245, 249, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }
        
        .reveal-overlay:hover {
            background: rgba(226, 232, 240, 0.95);
        }
        
        .reveal-overlay.hidden-overlay {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col items-center pb-12">

    <main class="w-full max-w-3xl px-4">

                    Recommencer la série
                </button>
            </div>

        </div>
        
    </main>

        const db_s3 = [
            { l: "Craterellus cornucopioides", syn: ["craterellus cornucopioides"], c: "Trompette de la mort" },

            { l: "Tricholoma sulphureum", syn: ["tricholoma sulphureum"], c: "Tricholome soufré" },

            { l: "Laccaria amethystina", syn: ["laccaria amethystina"], c: "Laccaire améthyste" },

            { l: "Agaricus xanthodermus", syn: ["agaricus xanthodermus", "agaricus xanthoderma"], c: "Agaric jaunissant" },
            { l: "Coprinopsis atramentaria", syn: ["coprinopsis atramentaria", "coprinus atramentarius"], c: "Coprin noir d'encre" },
            { l: "Coprinus picaceus", syn: ["coprinus picaceus", "coprinopsis picacea"], c: "Coprin pie" },
            { l: "Entoloma lividum", syn: ["entoloma lividum", "entoloma sinuatum"], c: "Entolome livide" },
            { l: "Inocybe fastigiata", syn: ["inocybe fastigiata", "inocybe rimosa"], c: "Inocybe fastigié" },
            { l: "Cortinarius violaceus", syn: ["cortinarius violaceus"], c: "Cortinaire violet" },
            { l: "Cortinarius orellanus", syn: ["cortinarius orellanus"], c: "Cortinaire couleur de rocou" },
            { l: "Hypholoma fasciculare", syn: ["hypholoma fasciculare"], c: "Hypholome en touffe" },
            { l: "Kuehneromyces mutabilis", syn: ["kuehneromyces mutabilis"], c: "Pholiote changeante" },

            { l: "Paxillus involutus", syn: ["paxillus involutus"], c: "Paxille enroulé" },
            { l: "Boletus edulis", syn: ["boletus edulis"], c: "Cèpe de Bordeaux" },
            { l: "Scleroderma citrinum", syn: ["scleroderma citrinum", "scleroderma citrina"], c: "Scléroderme commun" },
            { l: "Lycoperdon perlatum", syn: ["lycoperdon perlatum"], c: "Vesse-de-loup perlée" },
            { l: "Ramaria stricta", syn: ["ramaria stricta"], c: "Clavaire dressée" },
            { l: "Clathrus archeri", syn: ["clathrus archeri"], c: "Anthurus d'Archer" },
            { l: "Phallus impudicus", syn: ["phallus impudicus"], c: "Satyre puant" }
        ];

        let currentDB = db_s1s2;
        let questionOrder = [];
        let currentIndex = 0;
        let score = 0;
        let hasAnswered = false;

        // Shuffle logic
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Ultra-forgiving normalization
        function normalizeString(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z]/g, "");
        }

        function switchTab(tab) {
            const btnS1S2 = document.getElementById('tab-s1s2');
            const btnS3 = document.getElementById('tab-s3');
            
            if (tab === 's1s2') {
                btnS1S2.className = "flex-1 sm:px-6 py-2 text-sm font-semibold rounded-md bg-white shadow-sm text-slate-800 transition-all";
                btnS3.className = "flex-1 sm:px-6 py-2 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-700 transition-all";
                currentDB = db_s1s2;
            } else {
                btnS3.className = "flex-1 sm:px-6 py-2 text-sm font-semibold rounded-md bg-white shadow-sm text-slate-800 transition-all";
                btnS1S2.className = "flex-1 sm:px-6 py-2 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-700 transition-all";
                currentDB = db_s3;
            }
            initQuiz();
        }

        async function fetchImagesWiki(mushroomName) {
            const query = encodeURIComponent(mushroomName);
            const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${query}&gsrnamespace=6&gsrlimit=15&prop=imageinfo&iiprop=url&iiurlwidth=800&format=json&origin=*`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                let images = [];
                
                if (data.query && data.query.pages) {
                    const pages = Object.values(data.query.pages);
                    for (let p of pages) {
                        if (p.imageinfo && p.imageinfo.length > 0) {
                            let imgUrl = p.imageinfo[0].thumburl || p.imageinfo[0].url;
                            let title = p.title ? p.title.toLowerCase() : "";
                            let lowerUrl = imgUrl.toLowerCase();
                            
                            // Advanced filtering to exclude text/diagrams as much as possible
                            const badKeywords = ['.svg', '.pdf', 'diagram', 'schema', 'map', 'icon', 'microscop', 'spore', 'text'];
                            const isBad = badKeywords.some(kw => lowerUrl.includes(kw) || title.includes(kw));

                            if (!isBad) {
                                images.push(imgUrl);
                            }
                        }
                    }
                }
                
                images = shuffleArray(images);
                let finalImages = images.slice(0, 2);
                
                while(finalImages.length < 2) {
                    finalImages.push(`https://placehold.co/800x600/e2e8f0/64748b?text=Image+Non+Trouv%C3%A9e`);
                }
                return finalImages;
            } catch (error) {
                console.error("API Error:", error);
                return [
                    `https://placehold.co/800x600/fee2e2/ef4444?text=Erreur+Connexion`,
                    `https://placehold.co/800x600/fee2e2/ef4444?text=Erreur+Connexion`
                ];
            }
        }

        function initQuiz() {
            questionOrder = shuffleArray([...Array(currentDB.length).keys()]);
            currentIndex = 0;
            score = 0;
            
            document.getElementById('end-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            
            loadQuestion();
        }

        async function loadQuestion() {
            if (currentIndex >= questionOrder.length) {
                showEndScreen();
                return;
            }

            const mushroom = currentDB[questionOrder[currentIndex]];
            hasAnswered = false;
            
            // UI Resets
            document.getElementById('progress-text').innerText = `Question ${currentIndex + 1} / ${currentDB.length}`;
            document.getElementById('score-text').innerText = score;
            
            const inputEl = document.getElementById('answer-input');
            inputEl.value = '';
            inputEl.className = "w-full px-4 py-3 text-lg font-medium text-slate-900 bg-slate-50 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 focus:bg-white transition-all placeholder-slate-400";
            inputEl.disabled = false;
            
            const feedbackEl = document.getElementById('feedback-message');
            feedbackEl.innerHTML = '';
            
            document.getElementById('hint-content').classList.add('hidden');
            document.getElementById('hint-text').innerText = mushroom.c;

            document.getElementById('btn-verify').classList.remove('hidden');
            document.getElementById('btn-next').classList.add('hidden');

            // Reset images and mask
            document.getElementById('img-1').classList.add('hidden');
            document.getElementById('img-2').classList.add('hidden');
            document.getElementById('overlay-2').classList.remove('hidden-overlay');

            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('hidden');
            document.getElementById('loading-view').classList.add('flex');

            // Fetch Data
            const images = await fetchImagesWiki(mushroom.l);
            
            document.getElementById('img-1').src = images[0];
            document.getElementById('img-2').src = images[1];

            // Show UI
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('flex');
            document.getElementById('quiz-view').classList.remove('hidden');
            
            document.getElementById('img-1').classList.remove('hidden');
            document.getElementById('img-2').classList.remove('hidden');
            
            // Auto focus conditionnel (uniquement sur écrans larges pour éviter le clavier virtuel intempestif)
            setTimeout(() => {
                if (window.innerWidth > 768) {
                    inputEl.focus();
                }
            }, 50);
        }

        function revealImage() {
            document.getElementById('overlay-2').classList.add('hidden-overlay');
            if (window.innerWidth > 768) {
                document.getElementById('answer-input').focus();
            }
        }

        function toggleHint() {
            const hint = document.getElementById('hint-content');
            hint.classList.toggle('hidden');
            if (window.innerWidth > 768) {
                document.getElementById('answer-input').focus();
            }
        }

        function verifyAnswer() {
            if (hasAnswered) return;
            
            const mushroom = currentDB[questionOrder[currentIndex]];
            const inputEl = document.getElementById('answer-input');
            const feedbackEl = document.getElementById('feedback-message');
            const userNormalized = normalizeString(inputEl.value);
            
            let isCorrect = false;
            for (let syn of mushroom.syn) {
                if (userNormalized === normalizeString(syn)) {
                    isCorrect = true;
                    break;
                }
            }

            hasAnswered = true;
            inputEl.disabled = true;

            // Automatically reveal the second image when verifying
            document.getElementById('overlay-2').classList.add('hidden-overlay');

            if (isCorrect) {
                inputEl.classList.add('input-success');
                inputEl.classList.remove('border-slate-200');
                feedbackEl.innerHTML = `✨ <b>Exact !</b> C'est bien le <span class="text-green-700">${mushroom.c}</span>.`;
                feedbackEl.className = "text-sm min-h-[24px] mt-2 pl-1 text-emerald-600";
                score++;
                document.getElementById('score-text').innerText = score;
            } else {
                inputEl.classList.add('input-error');
                inputEl.classList.remove('border-slate-200');
                feedbackEl.innerHTML = `❌ <b>Faux.</b> Réponse attendue : <span class="text-red-700 underline underline-offset-2">${mushroom.l}</span> (${mushroom.c})`;
                feedbackEl.className = "text-sm min-h-[24px] mt-2 pl-1 text-red-600";
            }
            
            document.getElementById('btn-verify').classList.add('hidden');
            const btnNext = document.getElementById('btn-next');
            btnNext.classList.remove('hidden');
            
            // On met le focus sur le bouton "Suivant" pour permettre l'appui sur Entrée
            btnNext.focus();
        }

        function nextQuestion() {
            if (!hasAnswered) return;
            currentIndex++;
            loadQuestion();
        }

        function showEndScreen() {
            document.getElementById('quiz-view').classList.add('hidden');
            const endScreen = document.getElementById('end-view');
            endScreen.classList.remove('hidden');
            endScreen.classList.add('flex');
            
            document.getElementById('final-score').innerText = `${score} / ${currentDB.length}`;
            
            // Gestion du message personnalisé
            const messageEl = document.getElementById('custom-message');
            const iconEl = document.getElementById('end-icon');
            
            // Si le score est strictement supérieur à la moyenne
            if (score > currentDB.length / 2) {
                messageEl.innerText = "Bravo, tu vas me devoir une bière ! 🍻";
                messageEl.className = "text-xl font-bold text-emerald-600 mb-8";
                iconEl.innerText = "🏆";
            } else {
                messageEl.innerText = "Allez, on ne lâche rien ! Encore un petit essai pour avoir la moyenne ! 💪";
                messageEl.className = "text-xl font-medium text-amber-600 mb-8";
                iconEl.innerText = "🍄";
            }
        }

        // Global Event Listener pour la touche Entrée
        document.getElementById('answer-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault(); // Empêche les comportements parasites du navigateur
                if (!hasAnswered) {
                    verifyAnswer();
                } else {
                    nextQuestion();
                }
            }
        });

        // Initialize App
        initQuiz();

    </script>
</body>
</html>
